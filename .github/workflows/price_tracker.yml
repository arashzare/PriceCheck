name: Daily Huawei Watch D2 & D3 Price Tracker

on:
  schedule:
    # Runs everyday at 12:00 UTC (8:00 AM EDT / 5:00 AM PDT)
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows manual run button from GitHub UI

jobs:
  check-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Daily Price & Deal Checker
        env:
          TARGET_PRICE_CAD: ${{ secrets.TARGET_PRICE_CAD || '420.0' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python tracker.py

      - name: Upload Daily Deals Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-deals-report
          path: latest_deals_report.md
          retention-days: 7
